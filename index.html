<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="todo-card">
    <header class="page-header">
      <p class="eyebrow">STAY ORGANIZED</p>
      <h1>My To-Do List</h1>
      <p class="subtitle">Add your tasks and keep track of what you need to do.</p>
    </header>

    <form id="task-form" class="task-form">
      <label class="sr-only" for="task-input">Enter a task</label>
      <input id="task-input" type="text" placeholder="What do you need to do?" maxlength="120" autocomplete="off" required>
      <button type="submit" class="add-button">Add Task</button>
    </form>

    <p id="task-count" class="task-count" aria-live="polite">0 tasks</p>
    <ul id="task-list" class="task-list" aria-label="To-do tasks"></ul>
    <p id="empty-message" class="empty-message">No tasks yet. Add your first task above.</p>
  </main>
</body>
</html>
